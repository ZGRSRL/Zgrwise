services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zgrpass}
      POSTGRES_DB: ${POSTGRES_DB:-zgrwise}
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./tools/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zgr} -d ${POSTGRES_DB:-zgrwise}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://zgr:zgrpass@db:5432/zgrwise}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OLLAMA_BASE=${OLLAMA_BASE:-}
      - API_KEY=${API_KEY:-devkey}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-temp-key}
      - SECRET_KEY=${SECRET_KEY:-default-secret-key}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./apps/api:/app
      - ./data/exports:/data/exports

  worker:
    build: ./apps/worker
    command: python -m worker.main
    depends_on: [api, redis, db]
    environment:
      - PYTHONPATH=/worker
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://zgr:zgrpass@db:5432/zgrwise}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OLLAMA_BASE=${OLLAMA_BASE:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-temp-key}
    volumes:
      - ./apps/worker:/worker
      - ./data/exports:/data/exports

  web:
    build: ./apps/web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      api: { condition: service_started }
    ports: ["3000:3000"]
    volumes:
      - ./apps/web:/app
      - node_modules_cache:/app/node_modules

  scheduler:
    build: ./apps/worker
    command: python -m worker.scheduler
    depends_on: [api, worker, redis, db]
    environment:
      - PYTHONPATH=/worker
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://zgr:zgrpass@db:5432/zgrwise}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - OLLAMA_BASE=${OLLAMA_BASE:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-temp-key}
    volumes:
      - ./apps/worker:/worker

volumes:
  db_data:
  exports:
  node_modules_cache: 