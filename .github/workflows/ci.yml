name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  POSTGRES_VERSION: "16"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install poetry
          poetry install --no-interaction --no-ansi
          cd ../worker
          poetry install --no-interaction --no-ansi

      - name: Install Node.js dependencies
        run: |
          cd apps/web
          npm ci

      - name: Lint Python code (API)
        run: |
          cd apps/api
          poetry run ruff check .
          poetry run black --check .

      - name: Lint Python code (Worker)
        run: |
          cd apps/worker
          poetry run ruff check .
          poetry run black --check .

      - name: Lint TypeScript code
        run: |
          cd apps/web
          npm run lint

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zgrwise_test
          POSTGRES_USER: zgr
          POSTGRES_PASSWORD: zgrpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install poetry
          poetry install --no-interaction --no-ansi
          cd ../worker
          poetry install --no-interaction --no-ansi

      - name: Install Node.js dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run API tests
        env:
          DATABASE_URL: postgresql+psycopg://zgr:zgrpass@localhost:5432/zgrwise_test
          REDIS_URL: redis://localhost:6379/0
          API_KEY: test-key
          SECRET_KEY: test-secret-key
          GEMINI_API_KEY: test-gemini-key
        run: |
          cd apps/api
          poetry run pytest tests/ -v --cov=app --cov-report=xml --cov-report=html

      - name: Run Worker tests
        env:
          DATABASE_URL: postgresql+psycopg://zgr:zgrpass@localhost:5432/zgrwise_test
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: test-gemini-key
        run: |
          cd apps/worker
          poetry run pytest tests/ -v --cov=worker --cov-report=xml --cov-report=html

      - name: Run Web tests
        run: |
          cd apps/web
          npm run build

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./apps/api/coverage.xml,./apps/worker/coverage.xml
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd apps/api
          pip install poetry
          poetry install --no-interaction --no-ansi
          cd ../worker
          poetry install --no-interaction --no-ansi

      - name: Run security scan
        run: |
          pip install bandit safety
          bandit -r apps/api/app apps/worker/worker -f json -o bandit-report.json || true
          safety check --json --output safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            zgrwise/api
            zgrwise/worker
            zgrwise/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: zgrwise/api:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/worker
          push: true
          tags: zgrwise/worker:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: zgrwise/web:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # This could be SSH to your server, Kubernetes deployment, etc.
